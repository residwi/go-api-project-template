all: true
force-file-write: true
formatter: goimports
log-level: info
template: testify

dir: "{{.InterfaceDir}}"
pkgname: "{{.SrcPackageName}}"
filename: "mocks_test.go"

# One recursive rule instead of an entry per interface: every interface gets
# exactly one mock, written into the package that declares it. Per-slice
# ports -- the shape this refactor is moving toward -- have exactly one
# consumer, their own tests, so that is always the right destination, and the
# per-interface `configs:` fan-out check 4 policed no longer exists to drift.
#
# The modules not yet sliced still split <feature> from <feature>/http, and
# mockery cannot write a private mock into a package that does not declare
# the interface -- so their existing <feature>/http/mocks_test.go, built by
# the old *dual config, is no longer regenerated here. It stays correct until
# the interface it mirrors next changes; go vet in that http/ package will
# catch the drift as an ordinary compile error when it does.
#
# Rooted at internal/ rather than internal/modules and internal/platform
# separately: internal/server/middleware's auth_test.go calls
# NewMockTokenValidator and NewMockUserStatusChecker, so a narrower root would
# silently stop regenerating that package's mocks. internal/server/response
# also declares an interface (Validator), but nothing consumes
# MockValidator -- bind_test.go uses a hand-rolled fakeValidator -- it just
# comes along for free at no cost from rooting one level up for middleware.
packages:
  github.com/residwi/go-api-project-template/internal:
    config:
      recursive: true
