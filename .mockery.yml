all: false
dir: "mocks/{{.SrcPackageName}}"
filename: "mock_{{.InterfaceName}}.go"
force-file-write: true
formatter: goimports
log-level: info
pkgname: "mocks"
template: testify
packages:
  github.com/residwi/go-api-project-template/internal/modules/auth:
    interfaces:
      UserProvider:
  github.com/residwi/go-api-project-template/internal/modules/user:
    interfaces:
      Repository:
      StatusCache:
  github.com/residwi/go-api-project-template/internal/modules/category:
    interfaces:
      Repository:
      ProductCounter:
  github.com/residwi/go-api-project-template/internal/modules/product:
    interfaces:
      Repository:
      InventoryReader:
      InventoryRegistrar:
  github.com/residwi/go-api-project-template/internal/modules/inventory:
    interfaces:
      Repository:
  github.com/residwi/go-api-project-template/internal/modules/cart:
    interfaces:
      Repository:
      ProductLookup:
  github.com/residwi/go-api-project-template/internal/modules/order:
    interfaces:
      Repository:
      CartProvider:
      InventoryReserver:
      PaymentInitiator:
      PaymentJobCanceller:
      CouponReserver:
      NotificationEnqueuer:
  github.com/residwi/go-api-project-template/internal/modules/payment:
    interfaces:
      Repository:
      OrderUpdater:
      OrderItemsGetter:
      OrderGetter:
      InventoryDeductor:
      InventoryRestorer:
      CouponReleaser:
      Gateway:
  github.com/residwi/go-api-project-template/internal/modules/shipping:
    interfaces:
      Repository:
      OrderProvider:
      OrderUpdater:
  github.com/residwi/go-api-project-template/internal/modules/review:
    interfaces:
      Repository:
      PurchaseVerifier:
  github.com/residwi/go-api-project-template/internal/modules/promotion:
    interfaces:
      Repository:
  github.com/residwi/go-api-project-template/internal/modules/wishlist:
    interfaces:
      Repository:
  github.com/residwi/go-api-project-template/internal/modules/notification:
    interfaces:
      Repository:
  github.com/residwi/go-api-project-template/internal/modules/dashboard:
    interfaces:
      Repository:
  # TokenValidator and UserStatusChecker have exactly one consumer: the
  # declaring package's own in-package test file. Generating them out to
  # mocks/middleware (this file's default dir/pkgname/filename) would recreate
  # the middleware -> mocks/middleware -> middleware import cycle that led to
  # hand-rolled test doubles in the first place (see 61fcb81). Overriding back
  # to mockery's own defaults here generates the mock in-package instead, so it
  # references TokenValidator/UserStatusChecker directly with no self-import.
  # Do not copy this pattern to other entries: every other mocked interface in
  # this file has multiple consumers, including sibling packages that cannot
  # import another package's _test.go files.
  github.com/residwi/go-api-project-template/internal/transport/http/middleware:
    config:
      dir: "{{.InterfaceDir}}"
      pkgname: "{{.SrcPackageName}}"
      filename: "mocks_test.go"
    interfaces:
      TokenValidator:
      UserStatusChecker:
