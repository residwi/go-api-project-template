all: false
force-file-write: true
formatter: goimports
log-level: info
template: testify

# Root defaults: generate into the interface's own package, as a private test
# file. Mocks reference their package's types unqualified, so there is no
# self-import and no cycle -- which is what lets a feature's service test be
# `package <feature>` instead of `package <feature>_test`.
#
# The middleware entry below used to need an explicit override to get exactly
# this behaviour. These defaults make it the norm, so that override is gone.
dir: "{{.InterfaceDir}}"
pkgname: "{{.SrcPackageName}}"
filename: "mocks_test.go"

# A _test.go file is excluded from a package's importable GoFiles, so a private
# mock is invisible to every other package -- including the feature's own http/
# subpackage. Each interface therefore names every package that needs it. The
# alternative was public mocks.go files, which would have put ~172 mock
# identifiers into order's exported API.
#
# INVARIANT: `*dual`'s second destination is "{{.InterfaceDir}}/http", so it may
# only be used for interfaces declared at a module root that has an http/
# adapter. All 14 modules satisfy this. Violating it silently creates a stray
# http/ directory containing nothing but a test file -- go build, go vet,
# go test, golangci-lint and check-boundaries.sh all stay silent about it.
# Task 8 adds a boundary check for exactly this.
packages:
  github.com/residwi/go-api-project-template/internal/modules/auth:
    interfaces:
      UserProvider:
        configs: &dual
          - {dir: "{{.InterfaceDir}}", pkgname: "{{.SrcPackageName}}", filename: "mocks_test.go"}
          - {dir: "{{.InterfaceDir}}/http", pkgname: "http", filename: "mocks_test.go"}
  github.com/residwi/go-api-project-template/internal/modules/user:
    interfaces:
      Repository: {configs: *dual}
      # StatusCache has no *dual: nothing in user/http uses it -- handler_test.go
      # builds the service with user.NoCache{} instead -- so a second destination
      # would just be a dead mock nobody imports.
      StatusCache:
        configs:
          - {dir: "{{.InterfaceDir}}", pkgname: "{{.SrcPackageName}}", filename: "mocks_test.go"}
  github.com/residwi/go-api-project-template/internal/modules/category:
    interfaces:
      Repository: {configs: *dual}
      ProductCounter: {configs: *dual}
  # product and inventory need a third destination: internal/bootstrap tests the
  # adapters that translate between features, so it builds real product and
  # inventory services out of their repository mocks. Both interfaces are named
  # Repository, so both need structname to avoid colliding in one package.
  github.com/residwi/go-api-project-template/internal/modules/product:
    interfaces:
      Repository:
        configs:
          - {dir: "{{.InterfaceDir}}", pkgname: "{{.SrcPackageName}}", filename: "mocks_test.go"}
          - {dir: "{{.InterfaceDir}}/http", pkgname: "http", filename: "mocks_test.go"}
          - {dir: "internal/bootstrap", pkgname: "bootstrap", filename: "mocks_product_test.go", structname: "MockProductRepository"}
      InventoryReader:
        configs:
          - {dir: "{{.InterfaceDir}}", pkgname: "{{.SrcPackageName}}", filename: "mocks_test.go"}
          - {dir: "{{.InterfaceDir}}/http", pkgname: "http", filename: "mocks_test.go"}
          - {dir: "internal/bootstrap", pkgname: "bootstrap", filename: "mocks_product_test.go"}
      InventoryRegistrar:
        configs:
          - {dir: "{{.InterfaceDir}}", pkgname: "{{.SrcPackageName}}", filename: "mocks_test.go"}
          - {dir: "{{.InterfaceDir}}/http", pkgname: "http", filename: "mocks_test.go"}
          - {dir: "internal/bootstrap", pkgname: "bootstrap", filename: "mocks_product_test.go"}
  github.com/residwi/go-api-project-template/internal/modules/inventory:
    interfaces:
      Repository:
        configs:
          - {dir: "{{.InterfaceDir}}", pkgname: "{{.SrcPackageName}}", filename: "mocks_test.go"}
          - {dir: "{{.InterfaceDir}}/http", pkgname: "http", filename: "mocks_test.go"}
          - {dir: "internal/bootstrap", pkgname: "bootstrap", filename: "mocks_inventory_test.go", structname: "MockInventoryRepository"}
  github.com/residwi/go-api-project-template/internal/modules/cart:
    interfaces:
      Repository: {configs: *dual}
      ProductLookup: {configs: *dual}
  github.com/residwi/go-api-project-template/internal/modules/order:
    interfaces:
      Repository: {configs: *dual}
      CartProvider: {configs: *dual}
      InventoryReserver: {configs: *dual}
      PaymentInitiator: {configs: *dual}
      PaymentJobCanceller: {configs: *dual}
      CouponReserver: {configs: *dual}
      NotificationEnqueuer: {configs: *dual}
  github.com/residwi/go-api-project-template/internal/modules/payment:
    interfaces:
      Repository: {configs: *dual}
      OrderUpdater: {configs: *dual}
      OrderItemsGetter: {configs: *dual}
      OrderGetter: {configs: *dual}
      InventoryDeductor: {configs: *dual}
      InventoryRestorer: {configs: *dual}
      CouponReleaser: {configs: *dual}
      Gateway: {configs: *dual}
  github.com/residwi/go-api-project-template/internal/modules/shipping:
    interfaces:
      Repository: {configs: *dual}
      OrderProvider: {configs: *dual}
      OrderUpdater: {configs: *dual}
  github.com/residwi/go-api-project-template/internal/modules/review:
    interfaces:
      Repository: {configs: *dual}
      PurchaseVerifier: {configs: *dual}
  github.com/residwi/go-api-project-template/internal/modules/promotion:
    interfaces:
      Repository: {configs: *dual}
  github.com/residwi/go-api-project-template/internal/modules/wishlist:
    interfaces:
      Repository: {configs: *dual}
  github.com/residwi/go-api-project-template/internal/modules/notification:
    interfaces:
      Repository: {configs: *dual}
  github.com/residwi/go-api-project-template/internal/modules/dashboard:
    interfaces:
      Repository: {configs: *dual}
  # No override, and no *dual. TokenValidator and UserStatusChecker are declared
  # in internal/transport/http/middleware, which has no http/ subdirectory, so
  # *dual would write into internal/transport/http/middleware/http/. The root
  # defaults do the right thing: in-package, as a test file.
  github.com/residwi/go-api-project-template/internal/transport/http/middleware:
    interfaces:
      TokenValidator:
      UserStatusChecker:
